<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2240">
<meta name="description" content="Caça ao tesouro da Tia Sónia.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tezouro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Tia Sónia e a Odisseia do Tezouro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&family=Ubuntu+Mono:wght@400;700&family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,700&display=swap">

<style>
/* Layout: uma página por ecrã, pilha vertical com scroll e barra fixa em baixo.
   Tema por página — o motor troca os tokens conforme o nível.
   Paleta do nível 1: mar nocturno, ouro de doblão, vermelho de lenço e verde de papagaio. */
:root{
  --bg:#06120C;
  --bg-2:#0C1F16;
  --papel:#F7E7BD;
  --fg:#F4F8F5;
  --fg-mute:#9FB3A8;
  --ouro:#F5C242;
  --ouro-fundo:#C9901A;
  --vermelho:#D7263D;
  --verde:#3FB24A;
  --tinta:#2A1A0C;
  --linha:#23362C;
  --font-display:"Pirata One",Impact,fantasy;
  --font-enigma:"IM Fell English",Georgia,"Times New Roman",serif;
  --font-titulo:"Baloo 2",system-ui,sans-serif;
  --font-corpo:"Nunito",system-ui,-apple-system,sans-serif;
  --barra:70px;
  color-scheme:dark;
}
.tema-piratas{
  --bg:#0A2240;
  --bg-2:#133B63;
  --fg:#FFF6E0;
  --fg-mute:#BFD4E6;
  --linha:#1E5283;
  /* no nível, todo o texto de conteúdo é escrito como num diário de bordo */
  --font-corpo:var(--font-enigma);
}
/* capa: registo de computador de bordo */
.tema-consola{
  --font-display:"Ubuntu Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --font-corpo:"Ubuntu Mono","SFMono-Regular",Menlo,Consolas,monospace;
}

html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-corpo);
  font-size:19px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
*,*::before,*::after{box-sizing:border-box}
img{display:block;max-width:100%}

.pagina{min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg)}
.pagina-conteudo{
  width:100%;max-width:660px;margin-inline:auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:30px calc(var(--barra) + 48px);
  flex:1;display:flex;flex-direction:column;min-width:0;
}

/* ============ PÁGINA 00 — capa ============ */
.capa{justify-content:center;text-align:center}
.capa::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(85% 55% at 50% 24%,rgba(245,194,66,.22),transparent 68%),
             radial-gradient(75% 50% at 50% 100%,rgba(10,34,64,.6),transparent 70%);
}
.capa h1{margin:0}
.capa-logo{
  width:min(100%,560px);margin:0 auto;
  filter:drop-shadow(0 18px 38px rgba(0,0,0,.6));
}
.capa-sub{
  font-family:var(--font-display);
  font-weight:400;
  color:var(--ouro);
  font-size:clamp(1.7rem,7vw,2.3rem);
  line-height:1.2;
  margin:26px auto 0;max-width:24ch;text-wrap:balance;
}
.tema-consola .capa-sub{font-weight:700;font-size:clamp(1.15rem,4.6vw,1.5rem);letter-spacing:-.01em}
.tema-consola .btn{font-weight:700;font-size:1.5rem;letter-spacing:.04em}
.capa-regua{
  width:70px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--ouro),transparent);
  margin:30px auto;
}

/* ============ botões ============ */
.btn{
  display:block;width:100%;border:0;cursor:pointer;
  border-radius:16px;padding:22px 24px;
  font-family:var(--font-display);font-weight:400;
  font-size:1.9rem;letter-spacing:.03em;
  background:linear-gradient(180deg,#FFD866,var(--ouro-fundo));
  color:#2A1A0C;
  box-shadow:0 6px 0 #8C6210,0 14px 26px rgba(0,0,0,.4);
  transition:transform .1s ease,box-shadow .1s ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8C6210,0 8px 16px rgba(0,0,0,.4)}
.btn-vermelho{
  background:linear-gradient(180deg,#F04E60,var(--vermelho));
  color:#FFF4F2;box-shadow:0 6px 0 #8E1526,0 14px 26px rgba(0,0,0,.4);
}
.btn-vermelho:active{box-shadow:0 2px 0 #8E1526,0 8px 16px rgba(0,0,0,.4)}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px;border-radius:8px}

/* ============ PÁGINA 01 — nível pirata ============ */
.nivel{
  background:
    radial-gradient(120% 55% at 50% 0%,#1C5A91,transparent 62%),
    radial-gradient(100% 45% at 20% 100%,#0D3356,transparent 60%),
    var(--bg);
}
.nivel-cabecalho{text-align:center;margin-bottom:34px;padding-top:6px}
.nivel-cabecalho h1{
  font-family:var(--font-display);
  font-size:clamp(4.2rem,22vw,7.5rem);
  line-height:.9;margin:0;
  color:var(--ouro);
  text-shadow:0 4px 0 #8C6210,0 10px 24px rgba(0,0,0,.6);
}
.fita{
  display:inline-block;margin-top:14px;
  background:var(--vermelho);color:#FFF4F2;
  font-family:var(--font-display);font-weight:400;
  font-size:1.35rem;letter-spacing:.06em;
  padding:6px 22px 8px;border-radius:999px;
  box-shadow:0 4px 0 #8E1526;
}

/* painéis de papel */
.painel{
  position:relative;
  background:linear-gradient(170deg,#FDF2D4,var(--papel) 55%,#EBD4A2);
  color:var(--tinta);
  border-radius:18px;
  padding:30px 22px;
  box-shadow:0 14px 34px rgba(0,0,0,.45);
  margin-top:34px;
}
.painel h2{
  font-family:var(--font-display);
  font-size:clamp(2.6rem,11vw,3.6rem);
  line-height:1;margin:0;text-align:center;
  color:var(--vermelho);
  text-shadow:0 3px 0 rgba(0,0,0,.14);
}
.selo{
  display:block;text-align:center;
  font-family:var(--font-display);font-weight:400;
  font-size:1.35rem;letter-spacing:.05em;
  color:#8A6B3A;margin:6px 0 26px;
}
.artigos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.artigos li{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;min-width:0}
.artigos .num{
  font-family:var(--font-display);font-size:2.6rem;line-height:.9;
  color:var(--ouro-fundo);text-align:center;
  text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.artigos .texto{min-width:0;font-size:1.12rem;font-weight:500}
.artigos .rotulo{font-weight:700;color:var(--vermelho)}

.divisoria{display:flex;align-items:center;gap:16px;margin:40px 0 6px;color:var(--ouro)}
.divisoria::before,.divisoria::after{content:"";flex:1;height:2px;background:currentColor;opacity:.45;border-radius:2px}
.divisoria span{font-size:1.6rem}

/* papagaio + balões */
.palco-papagaio{display:flex;justify-content:center;margin-top:26px;margin-bottom:-18px}
.palco-papagaio img{
  width:min(58%,230px);
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));
  animation:baloicar 4.5s ease-in-out infinite;
}
@keyframes baloicar{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-8px)}}
.balao{
  position:relative;
  background:#FFFDF6;color:var(--tinta);
  border:3px solid var(--verde);
  border-radius:22px;
  padding:24px 22px;
  margin-top:26px;
  font-size:1.22rem;font-weight:600;line-height:1.55;
  box-shadow:0 12px 28px rgba(0,0,0,.4);
}
.balao::before,.balao::after{
  content:"";position:absolute;top:-18px;left:40px;
  border:9px solid transparent;border-bottom-color:var(--verde);
}
.balao::after{top:-12px;border-bottom-color:#FFFDF6}
.balao p{margin:0}

/* caixa da pista */
.pista{margin-top:46px;padding-top:40px;overflow:visible}
.pista .mapa{
  position:absolute;top:-56px;right:-10px;
  width:min(44%,190px);
  transform:rotate(7deg);
  filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));
  pointer-events:none;
}
.pista .selo-pista{
  display:block;
  font-family:var(--font-display);
  font-size:clamp(3rem,13vw,4.2rem);
  line-height:1;color:var(--vermelho);
  text-shadow:0 3px 0 rgba(0,0,0,.14);
  max-width:56%;
}
.pista .sub-pista{
  display:block;
  font-family:var(--font-display);font-weight:400;
  font-size:1.35rem;letter-spacing:.05em;
  color:#8A6B3A;margin:4px 0 30px;max-width:56%;
}
.enigma{
  white-space:pre-line;
  font-family:var(--font-enigma);font-weight:400;
  font-size:clamp(1.5rem,6.2vw,2rem);
  line-height:1.5;text-align:center;
  color:var(--tinta);
  background:rgba(255,255,255,.5);
  border:2px dashed var(--ouro-fundo);
  border-radius:16px;
  padding:26px 18px;
  margin:0 0 30px;
}
/* fotografias a comparar, dentro da adivinha */
.linha-fotos{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 24px}
.linha-fotos .btn{flex:1 1 140px;width:auto;min-width:0;font-size:1.5rem;padding:18px 16px}
/* coordenadas de uma grelha */
.coordenadas{
  margin:0 0 24px;padding:18px 18px;
  background:rgba(0,0,0,.08);
  border:2px solid rgba(185,154,98,.6);
  border-radius:12px;
}
.coordenadas h4{
  margin:0 0 12px;
  font-family:var(--font-titulo);font-weight:800;
  font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--vermelho);
}
.coordenadas ul{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px 16px;
}
.coordenadas li{
  font-family:"Ubuntu Mono","SFMono-Regular",Menlo,monospace;
  font-size:1.05rem;color:var(--tinta);font-variant-numeric:tabular-nums;
}
/* imagem que é o próprio enigma */
.imagem-enigma{margin:0 0 24px;display:flex;flex-direction:column;gap:8px;align-items:center}
.imagem-enigma button{
  display:block;padding:0;width:100%;cursor:zoom-in;
  background:none;border:2px solid #B99A62;border-radius:6px;overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
}
.imagem-enigma img{width:100%;display:block}
.imagem-enigma figcaption{
  font-family:var(--font-titulo);font-weight:700;
  font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#8A6B3A;
}
/* poema */
.poema{
  margin:0 0 24px;padding:22px 20px;
  background:
    radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.45),transparent 60%),
    linear-gradient(165deg,#F3E6C6,#E2CEA0);
  border:2px solid #B99A62;border-radius:4px;
  box-shadow:0 6px 14px rgba(0,0,0,.2);
}
.poema p{
  margin:0 0 6px;
  font-family:var(--font-enigma);font-style:italic;
  font-size:clamp(1.1rem,4.6vw,1.3rem);
  line-height:1.5;color:var(--tinta);
  text-indent:-12px;padding-left:12px;
}
.poema p:last-child{margin-bottom:0}
.poema h4{
  margin:0 0 12px;
  font-family:var(--font-titulo);font-weight:800;
  font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--vermelho);
}
.poema + .poema{margin-top:-10px}
/* folhas soltas de um diário */
.folhas{display:flex;flex-direction:column;gap:14px;margin:0 0 24px}
.folha{
  background:
    radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.45),transparent 60%),
    linear-gradient(165deg,#F3E6C6,#E2CEA0);
  border:2px solid #B99A62;
  border-radius:4px;
  padding:16px 18px;
  box-shadow:0 6px 14px rgba(0,0,0,.2);
}
.folha h4{
  margin:0 0 8px;
  font-family:var(--font-titulo);font-weight:800;
  font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--vermelho);
}
.folha p{
  margin:0;
  font-family:var(--font-enigma);
  font-size:1.15rem;line-height:1.5;color:var(--tinta);
}
/* passos numerados de uma adivinha */
.passos{
  margin:0 0 24px;padding:20px 18px 20px 42px;
  background:rgba(0,0,0,.08);
  border:2px solid rgba(185,154,98,.6);
  border-radius:12px;
  display:flex;flex-direction:column;gap:14px;
  counter-reset:passo;
}
.passos li{
  font-family:var(--font-titulo);font-weight:700;
  font-size:1.02rem;line-height:1.4;color:var(--tinta);
}
.passos li::marker{color:var(--vermelho);font-weight:800}
/* código a decifrar */
.codigo{
  margin:-6px 0 22px;
  font-family:"Ubuntu Mono","SFMono-Regular",Menlo,monospace;
  font-size:clamp(2.4rem,11vw,3.4rem);
  font-weight:700;letter-spacing:.22em;
  text-align:center;color:var(--vermelho);
  text-shadow:0 2px 0 rgba(0,0,0,.15);
  word-break:break-word;
}
/* código comprido, como uma mensagem em Morse */
.codigo.longo{
  font-size:clamp(1.25rem,5.5vw,1.7rem);
  letter-spacing:.1em;line-height:1.9;
  word-spacing:.3em;
  padding:18px 14px;
  background:rgba(0,0,0,.08);
  border:2px solid rgba(185,154,98,.6);
  border-radius:12px;
  overflow-wrap:anywhere;
}
/* instrução de resolução */
.instrucao{
  margin:0 0 26px;
  padding:16px 18px;
  background:rgba(184,134,11,.14);
  border:1px dashed var(--ouro-fundo);
  border-radius:12px;
  font-family:var(--font-titulo);font-weight:700;
  font-size:1.02rem;line-height:1.45;
  color:var(--tinta);text-align:center;
}
/* mensagem num pergaminho, dentro da caixa da adivinha */
.pergaminho{
  margin:0 0 28px;
  padding:24px 22px;
  background:
    radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.5),transparent 60%),
    linear-gradient(165deg,#F0DFB4,#DFC894);
  border:2px solid #B99A62;
  border-radius:4px;
  box-shadow:inset 0 0 40px rgba(150,110,50,.25),0 8px 18px rgba(0,0,0,.25);
  font-family:var(--font-enigma);
  font-size:clamp(1.2rem,5vw,1.5rem);
  line-height:1.5;color:var(--tinta);
}
.pergaminho p{margin:0}
.pergaminho cite{
  display:block;margin-top:14px;text-align:right;
  font-style:normal;font-size:.95rem;color:#8A6B3A;
}
.campo{display:flex;flex-direction:column;gap:14px}
.campo label{
  font-family:var(--font-display);font-weight:400;
  font-size:1.4rem;letter-spacing:.05em;color:#8A6B3A;
}
.campo input{
  width:100%;padding:20px 18px;
  font-family:var(--font-corpo);font-weight:700;
  font-size:1.6rem;text-align:center;
  color:var(--tinta);
  background:#FFFDF6;
  border:3px solid var(--ouro-fundo);
  border-radius:14px;
}
.campo input::placeholder{color:#B59A6A;font-weight:500}
.campo input:focus{border-color:var(--vermelho);outline:none}

/* ============ PÁGINA 02 ============ */
.obras{justify-content:center;text-align:center}
.obras h1{
  font-family:var(--font-display);
  font-size:clamp(3rem,15vw,5.5rem);
  line-height:1.02;margin:0;
  color:var(--vermelho);
  text-shadow:0 4px 0 #6E0F1C,0 12px 30px rgba(0,0,0,.6);
  text-wrap:balance;
}
.obras .aviso{margin-top:28px;color:var(--fg-mute);font-size:1.05rem}

/* ============ barra ============ */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(5,14,10,.94);
  backdrop-filter:blur(10px);
  border-top:2px solid rgba(245,194,66,.35);
  padding-top:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.barra-interior{max-width:660px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn-voltar{
  display:inline-flex;align-items:center;gap:8px;
  background:transparent;border:2px solid rgba(245,194,66,.5);
  color:var(--ouro);
  font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:1.05rem;
  padding:11px 22px;border-radius:999px;cursor:pointer;
}
.btn-voltar[disabled]{opacity:.3;cursor:default}
.barra-local{
  font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;
  font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:#7F9389;
}

/* ============ pop-ups ============ */
.veu{
  position:fixed;inset:0;z-index:60;
  background:rgba(4,10,18,.82);
  display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));
}
.popup{
  width:100%;max-width:420px;
  background:linear-gradient(170deg,#FDF2D4,#F2DFAE);
  color:var(--tinta);
  border:4px solid var(--ouro);
  border-radius:22px;
  padding:32px 24px 26px;text-align:center;
  box-shadow:0 28px 60px rgba(0,0,0,.65);
  animation:surge .22s ease-out;
}
@keyframes surge{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.popup .emblema{font-size:3.4rem;line-height:1;margin-bottom:8px}
.popup p{
  font-family:var(--font-titulo);font-weight:800;
  font-size:1.5rem;line-height:1.35;margin:0 0 26px;
}
.popup .certo{color:#1F7A4D}
.popup .errado{color:var(--vermelho)}
.popup-campo{
  width:100%;padding:18px 16px;margin:0 0 20px;
  font-family:"IM Fell English",Georgia,serif;font-weight:400;
  font-size:1.5rem;text-align:center;color:var(--tinta);
  background:#FFFDF6;border:3px solid var(--ouro-fundo);border-radius:14px;
}
.popup-campo::placeholder{color:#B59A6A}
.popup-campo:focus{border-color:var(--vermelho);outline:none}
/* botão principal da capa (nível de teste) */
.btn-grande{font-size:2.3rem;padding:30px 24px;border-radius:20px}
.botoes{display:flex;flex-direction:column;gap:18px}
.popup-botoes{display:flex;flex-direction:column;gap:12px}
.popup-botoes.grelha{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.popup-botoes.grelha .btn{font-size:1.5rem;padding:16px 8px}
.popup-botoes .btn-verde{background:linear-gradient(180deg,#5FD76B,#2E8B38);color:#042D0C;box-shadow:0 6px 0 #1C5B23}
.popup-botoes .btn-neutro{background:linear-gradient(180deg,#F3EAD6,#D8C8A8);color:#2A1A0C;box-shadow:0 6px 0 #9E8A64}
.popup-largo{max-width:480px}

/* ============ páginas de blocos (nível 0) ============ */
.lista-blocos{display:flex;flex-direction:column;gap:22px}
.lista-blocos .nivel-cabecalho{margin-bottom:4px}
.lista-blocos .instalar{gap:18px}
.lista-blocos .painel{margin-top:0}
.lista-blocos .pista{margin-top:26px}
.lista-blocos .palco-papagaio{margin:6px 0 -6px}
/* o papagaio acompanhado, por exemplo pela chave */
.palco-papagaio.com-par{
  align-items:center;gap:18px;
}
.palco-papagaio.com-par img{width:min(46%,190px)}
.palco-papagaio.com-par .ao-lado{
  width:min(26%,110px);
  animation:none;
  filter:drop-shadow(0 10px 22px rgba(245,194,66,.45));
}
.lista-blocos .balao{margin-top:0}
/* cena de fala: o Bacalhau à esquerda, os balões à direita */
.cena-fala{display:flex;align-items:flex-start;gap:12px;min-width:0}
.retrato{flex:0 0 76px;width:76px;position:sticky;top:12px}
.retrato img{
  width:100%;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));
  animation:baloicar 4.5s ease-in-out infinite;
}
.grupo-falas{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px}
/* o bico do balão passa para o lado esquerdo, a apontar ao papagaio */
.cena-fala .balao{margin-top:0}
.quem-fala{font-weight:700;color:var(--vermelho);letter-spacing:.02em}
.cena-fala .balao::before,
.cena-fala .balao::after{
  top:22px;left:-18px;
  border-bottom-color:transparent;
  border-right-color:var(--verde);
}
.cena-fala .balao::after{left:-12px;border-right-color:#FFFDF6}
.cena-fala .balao:not(:first-child)::before,
.cena-fala .balao:not(:first-child)::after{display:none}
@media (max-width:420px){
  .retrato{flex-basis:60px;width:60px}
  .cena-fala{gap:10px}
}
/* imagem de cena */
.moldura{
  margin:0;padding:0;
  display:flex;flex-direction:column;gap:10px;align-items:center;
}
.moldura img{
  width:100%;border-radius:8px;
  filter:drop-shadow(0 16px 32px rgba(0,0,0,.55));
}
.moldura figcaption{
  font-family:var(--font-titulo);font-weight:700;
  font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ouro);text-align:center;
}
/* ---------- motivos decorativos ---------- */
.repertorio{position:absolute;width:0;height:0;overflow:hidden}
.repertorio g{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.enfeites{
  display:flex;align-items:center;justify-content:center;gap:clamp(18px,7vw,40px);
  color:var(--ouro);
  padding:4px 0;
}
.motivo{
  width:clamp(40px,12vw,56px);height:auto;
  opacity:.72;
  transform:rotate(var(--giro,0deg));
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));
}
.marca-dagua{
  position:absolute;
  top:clamp(90px,22vw,150px);left:50%;
  width:min(78%,420px);height:auto;
  transform:translateX(-50%) rotate(-6deg);
  color:var(--ouro);
  opacity:.07;
  pointer-events:none;
  z-index:0;
}
.pagina{position:relative;overflow:hidden}
.pagina-conteudo{position:relative;z-index:1}
/* explicação de cena */
.texto-cena{
  margin:0;
  font-size:1.2rem;line-height:1.55;
  color:var(--fg-mute);text-align:center;text-wrap:balance;
}
.texto-cena.esquerda{
  text-align:left;text-wrap:pretty;
  color:var(--fg);
  border-left:3px solid var(--ouro);
  padding-left:16px;
}
/* botão do bilhete */
.btn-bilhete{
  background:linear-gradient(180deg,#FDF2D4,#D8C08A);
  color:var(--tinta);
  box-shadow:0 6px 0 #9E8A64,0 14px 26px rgba(0,0,0,.4);
}
.btn-bilhete:active{box-shadow:0 2px 0 #9E8A64,0 8px 16px rgba(0,0,0,.4)}
/* visor de bilhete em ecrã cheio */
.visor{
  position:fixed;inset:0;z-index:70;
  background:rgba(3,10,20,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  animation:surge .2s ease-out;
}
.visor img{
  max-width:100%;max-height:72vh;
  width:auto;
  object-fit:contain;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));
}
.visor-fechar{width:auto;min-width:200px;flex:0 0 auto}
/* linha do botão de responder e do avançar */
.linha-acoes{display:flex;flex-wrap:wrap;gap:12px}
.linha-acoes .btn{flex:1 1 180px;width:auto;min-width:0}
.btn-seguir{
  background:linear-gradient(180deg,#5FD76B,#2E8B38);
  color:#042D0C;box-shadow:0 6px 0 #1C5B23,0 14px 26px rgba(0,0,0,.4);
}
.btn-seguir:active{box-shadow:0 2px 0 #1C5B23,0 8px 16px rgba(0,0,0,.4)}
.caixa{
  background:rgba(255,255,255,.05);
  border:2px solid rgba(245,194,66,.32);
  border-radius:16px;
  padding:22px 20px;
}
.caixa.resolvida{border-color:var(--verde);background:rgba(63,178,74,.1)}
.caixa h3{
  font-family:var(--font-corpo);font-weight:700;
  font-size:1.25rem;line-height:1.45;margin:0 0 16px;color:var(--fg);
  white-space:pre-line;
}
.caixa .numero{
  display:inline-block;
  font-family:var(--font-display);font-size:1.25rem;
  letter-spacing:.04em;color:var(--ouro);
  margin-bottom:6px;
}
/* dados auxiliares (coordenadas, tabelas de pista) */
.caixa .dados{
  background:rgba(0,0,0,.3);
  border:1px dashed rgba(245,194,66,.45);
  border-radius:12px;
  padding:16px 18px;margin:0 0 18px;
}
.caixa .dados h4{
  font-family:var(--font-titulo);font-weight:700;
  font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ouro);margin:0 0 10px;
}
.caixa .dados ul{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px 14px;
}
.caixa .dados li{
  font-family:"Ubuntu Mono","SFMono-Regular",Menlo,monospace;
  font-size:1.05rem;color:var(--fg);
  font-variant-numeric:tabular-nums;
}
.opcoes.grelha-op{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opcoes.grelha-op .btn-op{
  width:100%;padding:16px 4px;font-size:1.3rem;
  font-family:var(--font-titulo);font-weight:800;
}
.caixa .marca{
  float:right;margin-left:12px;color:var(--verde);font-weight:700;font-size:1.3rem;
}
.caixa .nota{margin:14px 0 0;color:var(--verde);font-weight:700;font-size:1.05rem}
.linha-campo{display:flex;flex-wrap:wrap;gap:12px}
.linha-campo input{
  flex:1 1 180px;min-width:0;
  padding:16px 14px;
  font-family:var(--font-corpo);font-size:1.15rem;
  color:var(--fg);background:rgba(0,0,0,.35);
  border:2px solid rgba(245,194,66,.4);border-radius:12px;
}
.linha-campo input::placeholder{color:#7E8C86}
.linha-campo input:focus{border-color:var(--ouro);outline:none}
.btn-op{
  flex:1 1 auto;width:auto;
  font-size:1.2rem;padding:16px 22px;border-radius:12px;
  box-shadow:0 5px 0 #8C6210,0 10px 18px rgba(0,0,0,.35);
}
.opcoes{display:flex;flex-wrap:wrap;gap:12px}
.instalar{display:flex;flex-direction:column;gap:20px}
.instalar h4{
  font-family:var(--font-corpo);font-weight:700;font-size:1.05rem;
  letter-spacing:.14em;color:var(--ouro);margin:0 0 8px;
}
.instalar ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
.instalar li{font-size:1.02rem;line-height:1.4}
.aviso-forte{
  background:linear-gradient(135deg,#D7263D,#8E1526);
  border:2px solid var(--ouro);border-radius:16px;
  padding:22px 20px;text-align:center;
  font-family:var(--font-corpo);font-weight:700;
  font-size:1.25rem;line-height:1.4;color:#FFF4F2;
  text-transform:uppercase;letter-spacing:.02em;
}
.titulo-seccao{
  font-family:var(--font-corpo);font-weight:700;
  font-size:clamp(1.6rem,6.5vw,2.2rem);
  color:var(--ouro);text-align:center;
  margin:16px 0 0;text-wrap:balance;
}
.btn-reset{
  background:transparent;border:2px dashed var(--vermelho);
  color:#FF8A96;box-shadow:none;font-size:1.4rem;
}
.btn-reset:active{transform:translateY(2px);box-shadow:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>

const btnVoltar = document.getElementById("voltar");
const local = document.getElementById("local");

const CHAVE = "odisseia-tezouro-v1";
/* tudo o que a app guarda no telemóvel vive aqui (e é isto que o reset apaga) */
let estado = { historico:["00"], nome:"", feitos:{} };

function guardar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }catch(e){} }
function ler(){
  try{
    const bruto = localStorage.getItem(CHAVE);
    if(!bruto) return;
    const d = JSON.parse(bruto);
    if(Array.isArray(d.historico) && d.historico.length) estado.historico = d.historico;
    if(typeof d.nome === "string") estado.nome = d.nome;
    if(d.feitos && typeof d.feitos === "object") estado.feitos = d.feitos;
  }catch(e){}
}
function marcar(id, valor){ if(id){ estado.feitos[id] = valor === undefined ? true : valor; guardar(); } }
function apagarTudo(){
  try{ localStorage.removeItem(CHAVE); }catch(e){}
  estado = { historico:["00"], nome:"", feitos:{} };
}

/* validação tolerante: maiúsculas, espaços, acentos e pontuação */
function normalizar(t){
  return String(t).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
}
function certa(resposta, aceites){
  const dada = normalizar(resposta);
  return dada.length > 0 && aceites.some(a => normalizar(a) === dada);
}

const pagina = id => JOGO.paginas.find(p => p.id === id);
function el(tag, classe, texto){
  const e = document.createElement(tag);
  if(classe) e.className = classe;
  if(texto != null) e.textContent = texto;
  return e;
}
function imagem(src, alt, classe){
  const i = document.createElement("img");
  i.src = src; i.alt = alt || ""; if(classe) i.className = classe;
  i.loading = "eager"; i.decoding = "async";
  return i;
}

/* ---------- capa ---------- */
function construirCapa(dados){
  const c = el("div","pagina-conteudo capa");
  const h1 = el("h1");
  h1.appendChild(imagem(JOGO.logo, JOGO.titulo, "capa-logo"));
  c.appendChild(h1);
  c.appendChild(el("p","capa-sub",JOGO.subtitulo));
  c.appendChild(el("div","capa-regua"));

  const caixa = el("div","botoes");
  dados.botoes.forEach(def=>{
    const b = el("button","btn" + (def.destaque ? " btn-grande" : ""), def.texto);
    b.type="button";
    b.addEventListener("click",()=>{
      if(def.fechadura) pedirPasse(def.fechadura, def.destino);
      else irPara(def.destino);
    });
    caixa.appendChild(b);
  });
  c.appendChild(caixa);
  return c;
}

/* pede a palavra passe antes de deixar entrar na página */
function pedirPasse(f, destino){
  popup({
    emblema:"🔒", tipo:"neutro", texto:f.texto, botao:f.botao,
    campo:{ marcador:f.marcador },
    acao:valor=>{
      if(certa(valor, f.respostas)){
        popup({ emblema:f.certo.emblema, tipo:"certo", texto:f.certo.texto, botao:f.certo.botao,
                acao:()=>{ fecharPopup(); irPara(destino); } });
      }else{
        popup({ emblema:f.errado.emblema, tipo:"errado", texto:f.errado.texto, botao:f.errado.botao,
                acao:()=>fecharPopup() });
      }
    }
  });
}

/* ---------- páginas montadas por blocos ---------- */
const CERTO = { emblema:"🏴‍☠️", tipo:"certo", texto:"Certo, marujo!", botao:"Avante!" };
const ERRADO = { emblema:"⚓", tipo:"errado", texto:"Errado. Volta ao leme e tenta outra vez.", botao:"Arrr!" };

/* {nome} nos textos é trocado pelo nome do jogador */
function comNome(texto){ return String(texto).replace(/\{nome\}/g, estado.nome || "marujo"); }

function mostrar(def, aoFechar){
  popup({ emblema:def.emblema, tipo:def.tipo, texto:def.texto, botao:def.botao,
          acao:()=>{ fecharPopup(); if(aoFechar) aoFechar(); } });
}
function caixa(b){
  const c = el("section","caixa");
  if(b.id && estado.feitos[b.id]){
    c.classList.add("resolvida");
    c.appendChild(el("span","marca","✔"));
  }
  return c;
}
function marcaOk(c, b){
  if(!c.querySelector(".marca")){
    const m = el("span","marca","✔");
    c.insertBefore(m, c.firstChild);
  }
  c.classList.add("resolvida");
  marcar(b.id);
}
/* número da adivinha, enunciado e, se houver, a lista de dados extra */
function enunciado(c, b){
  if(b.n != null) c.appendChild(el("span","numero","Adivinha " + b.n));
  c.appendChild(el("h3",null,b.pergunta));
  if(b.extra){
    const bloco = el("div","dados");
    if(b.extraTitulo) bloco.appendChild(el("h4",null,b.extraTitulo));
    const lista = el("ul");
    b.extra.forEach(linha=>lista.appendChild(el("li",null,linha)));
    bloco.appendChild(lista);
    c.appendChild(bloco);
  }
}
function linhaCampo(marcador, rotuloBotao){
  const f = el("form","linha-campo");
  const i = el("input");
  i.type="text"; i.placeholder=marcador||"Escreve aqui"; i.autocomplete="off";
  i.setAttribute("autocapitalize","none"); i.setAttribute("spellcheck","false");
  const b = el("button","btn btn-op", rotuloBotao||"responder");
  b.type="submit";
  f.append(i,b);
  return { form:f, input:i };
}

const BLOCOS = {
  nome(b){
    const c = caixa(b);
    c.appendChild(el("h3",null,b.pergunta));
    const { form, input } = linhaCampo(b.marcador, b.botao);
    const nota = el("p","nota");
    if(estado.nome){ input.value = estado.nome; nota.textContent = "A bordo: " + estado.nome; }
    form.addEventListener("submit",ev=>{
      ev.preventDefault();
      const limpo = input.value.trim().replace(/\s+/g," ");
      const palavras = limpo ? limpo.split(" ") : [];
      if(palavras.length === 0 || palavras.length > 2){
        mostrar({ emblema:"⚓", tipo:"errado", texto:b.erro.texto, botao:b.erro.botao },
                ()=>{ input.focus(); input.select(); });
        return;
      }
      estado.nome = limpo; marcar(b.id, limpo);
      nota.textContent = "A bordo: " + limpo;
      marcaOk(c,b);
      mostrar({ ...b.sucesso, texto:comNome(b.sucesso.texto) });
    });
    c.append(form, nota);
    return c;
  },

  instalar(b){
    const c = caixa(b);
    c.appendChild(el("h3",null,b.titulo));
    const lista = el("div","instalar");
    b.sistemas.forEach(s=>{
      const bloco = el("div");
      bloco.appendChild(el("h4",null,s.nome));
      const ol = el("ol");
      s.passos.forEach(p=>ol.appendChild(el("li",null,p)));
      bloco.appendChild(ol);
      lista.appendChild(bloco);
    });
    c.appendChild(lista);
    return c;
  },

  aviso(b){ return el("div","aviso-forte",b.texto); },

  titulo(b){ return el("h2","titulo-seccao",b.texto); },

  cabecalho(b){
    const cab = el("header","nivel-cabecalho");
    cab.appendChild(el("h1",null,b.titulo));
    if(b.fita) cab.appendChild(el("span","fita",b.fita));
    return cab;
  },

  papagaio(b){
    const palco = el("div","palco-papagaio" + (b.aoLado ? " com-par" : ""));
    palco.appendChild(imagem(b.imagem, b.alt));
    if(b.aoLado) palco.appendChild(imagem(b.aoLado.imagem, b.aoLado.alt, "ao-lado"));
    return palco;
  },

  /* uma ou várias falas seguidas, cada uma no seu balão, sempre com o Bacalhau ao lado */
  fala(b){
    const cena = el("div","cena-fala");
    const retrato = el("div","retrato");
    retrato.appendChild(imagem(b.quemImagem || JOGO.papagaio, b.quemAlt || "Bacalhau, o papagaio"));
    cena.appendChild(retrato);

    const quem = (b.quem || "Bacalhau").toUpperCase() + ":";
    const grupo = el("div","grupo-falas");
    (b.textos || [b.texto]).forEach(texto=>{
      const balao = el("div","balao");
      const p = el("p");
      p.appendChild(el("strong","quem-fala",quem + " "));
      p.appendChild(document.createTextNode(comNome(texto)));
      balao.appendChild(p);
      grupo.appendChild(balao);
    });
    cena.appendChild(grupo);
    return cena;
  },

  /* fila de motivos decorativos, ao gosto do tema da ilha */
  enfeites(b){
    const fila = el("div","enfeites");
    b.simbolos.forEach((id,i)=>{
      const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("viewBox","0 0 100 100");
      svg.setAttribute("aria-hidden","true");
      svg.classList.add("motivo");
      svg.style.setProperty("--giro", ((i % 2 ? 1 : -1) * (4 + i * 2)) + "deg");
      const uso = document.createElementNS("http://www.w3.org/2000/svg","use");
      uso.setAttribute("href","#m-" + id);
      svg.appendChild(uso);
      fila.appendChild(svg);
    });
    return fila;
  },

  /* explicação curta, fora de balão de fala */
  texto(b){
    return el("p","texto-cena" + (b.alinhar === "esquerda" ? " esquerda" : ""), comNome(b.texto));
  },

  /* botão que abre o bilhete em ecrã cheio */
  bilhete(b){
    const bt = el("button","btn btn-bilhete",b.texto);
    bt.type="button";
    bt.addEventListener("click",()=>abrirVisor(b.imagem,b.alt));
    return bt;
  },

  /* imagem de cena: bilhete, mapa, fotografia */
  imagem(b){
    const moldura = el("figure","moldura");
    moldura.appendChild(imagem(b.imagem, b.alt));
    if(b.legenda) moldura.appendChild(el("figcaption",null,b.legenda));
    return moldura;
  },

  regras(b){
    const painel = el("section","painel");
    painel.appendChild(el("h2",null,b.titulo));
    painel.appendChild(el("span","selo",b.selo));
    const lista = el("ol","artigos");
    b.artigos.forEach((texto,i)=>{
      const li = el("li");
      li.appendChild(el("span","num",String(i+1)));
      const corpo = el("div","texto");
      corpo.appendChild(el("span","rotulo","Artigo "+(i+1)+": "));
      corpo.appendChild(document.createTextNode(texto));
      li.appendChild(corpo);
      lista.appendChild(li);
    });
    painel.appendChild(lista);
    return painel;
  },

  /* pista da ilha: enunciado, resposta e, depois de acertada, o botão de avançar */
  pista(b){
    const c = el("section","painel pista");
    if(b.mapa) c.appendChild(imagem(b.mapa.imagem, b.mapa.alt, "mapa"));
    c.appendChild(el("span","selo-pista",b.selo));
    c.appendChild(el("span","sub-pista",b.sub));
    c.appendChild(el("p","enigma",comNome(b.enigma)));

    /* fotografias a comparar */
    if(b.fotos){
      const linha = el("div","linha-fotos");
      b.fotos.forEach(f=>{
        const bt = el("button","btn btn-bilhete",f.texto);
        bt.type="button";
        bt.addEventListener("click",()=>{
          if(f.imagem) abrirVisor(f.imagem, f.alt || f.texto);
          else popup({ emblema:"📷", texto:f.aviso, botao:"Fechar", acao:()=>fecharPopup() });
        });
        linha.appendChild(bt);
      });
      c.appendChild(linha);
    }

    /* coordenadas de uma grelha, em colunas */
    if(b.coordenadas){
      const bloco = el("div","coordenadas");
      if(b.coordenadasTitulo) bloco.appendChild(el("h4",null,b.coordenadasTitulo));
      const lista = el("ul");
      b.coordenadas.forEach(linha=>lista.appendChild(el("li",null,linha)));
      bloco.appendChild(lista);
      c.appendChild(bloco);
    }

    /* imagem que é o próprio enigma; toca para ver em grande */
    if(b.imagemEnigma){
      const cartao = el("figure","imagem-enigma");
      const bt = el("button");
      bt.type="button";
      bt.appendChild(imagem(b.imagemEnigma.imagem, b.imagemEnigma.alt));
      bt.addEventListener("click",()=>abrirVisor(b.imagemEnigma.imagem, b.imagemEnigma.alt));
      cartao.appendChild(bt);
      if(b.imagemEnigma.legenda) cartao.appendChild(el("figcaption",null,b.imagemEnigma.legenda));
      c.appendChild(cartao);
    }

    /* poema, um verso por linha; vários poemas ficam cada um no seu pergaminho */
    (b.poemas || (b.poema ? [{ versos:b.poema }] : [])).forEach(p=>{
      const rolo = el("blockquote","poema");
      if(p.titulo) rolo.appendChild(el("h4",null,p.titulo));
      p.versos.forEach(verso=>rolo.appendChild(el("p",null,verso)));
      c.appendChild(rolo);
    });

    /* páginas soltas, como folhas de um diário */
    if(b.folhas){
      const caixa = el("div","folhas");
      b.folhas.forEach(f=>{
        const folha = el("article","folha");
        folha.appendChild(el("h4",null,f.titulo));
        folha.appendChild(el("p",null,comNome(f.texto)));
        caixa.appendChild(folha);
      });
      c.appendChild(caixa);
    }

    /* lista de passos numerados, uma alínea por linha */
    if(b.passos){
      const ol = el("ol","passos");
      b.passos.forEach(linha=>ol.appendChild(el("li",null,linha)));
      c.appendChild(ol);
    }

    /* código a decifrar, em destaque */
    if(b.codigo) c.appendChild(el("p","codigo" + (b.codigoLongo ? " longo" : ""), b.codigo));
    /* instrução de como resolver */
    if(b.instrucao) c.appendChild(el("p","instrucao",comNome(b.instrucao)));

    /* mensagem num pergaminho, quando a ilha tem uma */
    if(b.pergaminho){
      const rolo = el("blockquote","pergaminho");
      rolo.appendChild(el("p",null,comNome(b.pergaminho)));
      if(b.pergaminhoAssinatura) rolo.appendChild(el("cite",null,b.pergaminhoAssinatura));
      c.appendChild(rolo);
    }

    const form = el("form","campo");
    const label = el("label",null,b.etiqueta);
    label.setAttribute("for","resposta-"+b.id);
    const input = el("input");
    input.type="text"; input.id="resposta-"+b.id;
    input.placeholder=b.marcador; input.autocomplete="off";
    input.setAttribute("autocapitalize","none");
    input.setAttribute("spellcheck","false");

    const linha = el("div","linha-acoes");
    const enviar = el("button","btn btn-vermelho",b.botao);
    enviar.type="submit";
    linha.appendChild(enviar);

    /* só existe depois de a adivinha já ter sido acertada uma vez */
    const seguir = el("button","btn btn-seguir","avançar");
    seguir.type="button";
    seguir.hidden = !estado.feitos[b.id];
    seguir.addEventListener("click",()=>irPara(b.destino));
    linha.appendChild(seguir);

    form.append(label,input,linha);
    form.addEventListener("submit",ev=>{
      ev.preventDefault();
      if(certa(input.value,b.respostas)){
        marcar(b.id);
        seguir.hidden = false;
        if(b.certo.bilhete){
          /* acerto com bilhete: ver o bilhete ou seguir viagem */
          popup({ emblema:b.certo.emblema, tipo:b.certo.tipo, quem:b.certo.quem,
                  texto:b.certo.texto, botoes:[
            { texto:b.certo.bilhete.texto, classe:"btn-bilhete",
              acao:()=>abrirVisor(b.certo.bilhete.imagem, b.certo.bilhete.alt) },
            { texto:b.certo.botao, classe:"btn-seguir",
              acao:()=>{ fecharPopup(); irPara(b.destino); } }
          ]});
        }else{
          mostrar(b.certo, ()=>irPara(b.destino));
        }
      }else{
        mostrar(b.errado, ()=>{ input.focus(); input.select(); });
      }
    });
    c.appendChild(form);
    return c;
  },

  /* avanço simples numa cena sem adivinha */
  avancar(b){
    const bt = el("button","btn",b.texto || "Avançar");
    bt.type="button";
    bt.addEventListener("click",()=>{
      /* reiniciar: volta ao início sem deixar o caminho todo no botão Voltar */
      if(b.reiniciar){
        estado.historico = [b.destino];
        desenhar();
      }else{
        irPara(b.destino);
      }
    });
    return bt;
  },

  /* resposta por botões: o certo abre o pop-up de acerto, os outros o de erro */
  botoes(b){
    const c = caixa(b);
    enunciado(c,b);
    const linha = el("div","opcoes" + (b.grelha ? " grelha-op" : ""));
    b.opcoes.forEach(texto=>{
      const bt = el("button","btn btn-op",texto);
      bt.type="button";
      bt.addEventListener("click",()=>{
        if(certa(texto,b.respostas)) mostrar(CERTO, ()=>marcaOk(c,b));
        else mostrar(ERRADO);
      });
      linha.appendChild(bt);
    });
    c.appendChild(linha);
    return c;
  },

  /* resposta escrita */
  adivinha(b){
    const c = caixa(b);
    enunciado(c,b);
    const { form, input } = linhaCampo("Resposta","responder");
    form.addEventListener("submit",ev=>{
      ev.preventDefault();
      if(certa(input.value,b.respostas)) mostrar(CERTO, ()=>marcaOk(c,b));
      else mostrar(ERRADO, ()=>{ input.focus(); input.select(); });
    });
    c.appendChild(form);
    return c;
  },

  reset(b){
    const bt = el("button","btn btn-reset",b.botao);
    bt.type="button";
    bt.addEventListener("click",()=>{
      popup({ emblema:b.confirmacao.emblema, texto:b.confirmacao.texto, botoes:[
        { texto:b.confirmacao.botao, classe:"btn-vermelho", acao:()=>{
            apagarTudo();
            mostrar(b.feito, ()=>desenhar());
          }},
        { texto:b.confirmacao.cancelar, classe:"btn-neutro", acao:()=>fecharPopup() }
      ]});
    });
    return bt;
  }
};

function construirBlocos(dados){
  const c = el("div","pagina-conteudo");
  const lista = el("div","lista-blocos");
  dados.blocos.forEach(b=>{
    const construtor = BLOCOS[b.tipo];
    if(construtor) lista.appendChild(construtor(b));
  });
  c.appendChild(lista);
  return c;
}

/* ---------- aviso ---------- */
function construirAviso(dados){
  const c = el("div","pagina-conteudo obras");
  c.appendChild(el("h1",null,dados.titulo));
  if(dados.nota) c.appendChild(el("p","aviso",dados.nota));
  return c;
}

/* ---------- pop-up ---------- */
let acaoPopup = null;
function popup(cfg){
  popupEmblema.textContent = cfg.emblema || "";
  popupTexto.textContent = "";
  if(cfg.quem) popupTexto.appendChild(el("strong","quem-fala",cfg.quem.toUpperCase()+": "));
  popupTexto.appendChild(document.createTextNode(comNome(cfg.texto)));
  popupTexto.className = cfg.tipo || "";
  popupCampo.hidden = !cfg.campo;
  popupCampo.value = "";
  if(cfg.campo) popupCampo.placeholder = cfg.campo.marcador || "";
  popupCaixa.className = "popup" + (cfg.largo ? " popup-largo" : "");
  popupBotoes.className = "popup-botoes" + (cfg.grelha ? " grelha" : "");

  const lista = cfg.botoes || [{ texto:cfg.botao, classe:cfg.classe, acao:cfg.acao }];
  popupBotoes.innerHTML = "";
  acaoPopup = null;
  lista.forEach((def,i)=>{
    const b = el("button","btn "+(def.classe || "btn-vermelho"), def.texto);
    if(cfg.campo && i === 0){
      b.type = "submit";
      acaoPopup = def.acao;
    }else{
      b.type = "button";
      b.addEventListener("click",()=>{ if(def.acao) def.acao(b); });
    }
    popupBotoes.appendChild(b);
  });

  veu.hidden = false;
  const primeiro = popupBotoes.querySelector("button");
  (cfg.campo ? popupCampo : primeiro).focus();
}
function fecharPopup(){ veu.hidden = true; acaoPopup = null; }

/* visor de imagem em ecrã cheio, para os bilhetes */
function abrirVisor(src, alt){
  visorImagem.src = src;
  visorImagem.alt = alt || "";
  visor.hidden = false;
  visorFechar.focus();
}
function fecharVisor(){ visor.hidden = true; visorImagem.removeAttribute("src"); }
visorFechar.addEventListener("click",fecharVisor);
visor.addEventListener("click",ev=>{ if(ev.target === visor) fecharVisor(); });
document.addEventListener("keydown",ev=>{ if(ev.key === "Escape" && !visor.hidden) fecharVisor(); });
popupForm.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(acaoPopup) acaoPopup(popupCampo.value);
});

/* ---------- navegação ---------- */
function desenhar(){
  const id = estado.historico[estado.historico.length-1];
  const dados = pagina(id) || pagina("00");

  app.innerHTML = "";
  const seccao = el("section","pagina");
  seccao.id = "pagina-"+dados.id;
  if(dados.tema==="piratas") seccao.classList.add("nivel");

  if(dados.tipo==="capa") seccao.appendChild(construirCapa(dados));
  else if(dados.tipo==="blocos") seccao.appendChild(construirBlocos(dados));
  else seccao.appendChild(construirAviso(dados));

  /* marca de água com o motivo principal da ilha */
  if(dados.marca){
    const fundo = document.createElementNS("http://www.w3.org/2000/svg","svg");
    fundo.setAttribute("viewBox","0 0 100 100");
    fundo.setAttribute("aria-hidden","true");
    fundo.classList.add("marca-dagua");
    const uso = document.createElementNS("http://www.w3.org/2000/svg","use");
    uso.setAttribute("href","#m-" + dados.marca);
    fundo.appendChild(uso);
    seccao.insertBefore(fundo, seccao.firstChild);
  }

  app.appendChild(seccao);
  document.body.className = "tema-"+dados.tema;
  local.textContent = dados.rotulo;
  btnVoltar.disabled = estado.historico.length <= 1;
  window.scrollTo(0,0);
  guardar();
}
function irPara(id){
  if(!pagina(id)) return;
  estado.historico.push(id);
  desenhar();
}
btnVoltar.addEventListener("click",()=>{
  if(estado.historico.length>1){ estado.historico.pop(); desenhar(); }
});

ler();
estado.historico = estado.historico.filter(id => !!pagina(id));
if(!estado.historico.length) estado.historico = ["00"];
desenhar();

/* já conhecemos o jogador: dá-lhe as boas-vindas de volta */
if(estado.nome && JOGO.regresso){
  mostrar({ ...JOGO.regresso, texto:comNome(JOGO.regresso.texto) });
}
</script>
